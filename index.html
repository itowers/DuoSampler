const stepPage=()=>Math.min(U.page,S.loops[U.selLoop].bars-1);
function stepEvs(s){const L=S.loops[U.selLoop],st=stepPage()*16+s;return L.events.filter(e=>Math.floor(e.t)===st&&(U.inst==='D'?(e.k==='d'&&e.i===U.selPad):e.k==='n'));}
function writeNotes(){if(U.lastNotes&&(U.mode==='KEYS')===U.single)return U.lastNotes.slice();if(U.mode==='KEYS'){U.lastChord=nn(padNote(12));U.single=true;return U.lastNotes=[padNote(12)];}const c=chord(0);U.lastChord=c.name;U.lastDeg=0;U.lastRoot=c.root;U.single=false;return U.lastNotes=c.notes;}
function toggleStep(s){const L=S.loops[U.selLoop],st=stepPage()*16+s,ex=stepEvs(s),now=ctx.currentTime;
 if(ex.length){L.events=L.events.filter(e=>ex.indexOf(e)<0);}
 else{newLayer();if(U.inst==='D'){L.events.push({k:'d',i:U.selPad,kit:S.kit,dur:.2,t:st,layer:L.layer});if(!U.playing)drum(U.selPad,now,liveDest());}
  else{const m=writeNotes(),dur=stepDur()*.9;L.events.push({k:'n',m,p:S.preset,dur,t:st,layer:L.layer,st:U.strum?1:0});if(!U.playing)m.forEach(n=>synthOn(n,now,liveDest(),PRE[S.preset]).off(now+dur));}}
 save();}

function fromData(d,sr){const b=ctx.createBuffer(1,d.length,sr);b.getChannelData(0).set(d);return b;}
function normalize(d){let p=0;for(let i=0;i<d.length;i++){const x=Math.abs(d[i]);if(x>p)p=x;}if(p>0){const k=.95/p;for(let i=0;i<d.length;i++)d[i]*=k;}return d;}

  mic.proc.onaudioprocess=e=>{const d=new Float32Array(e.inputBuffer.getChannelData(0));let p=0;for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>p)p=a;}mic.lvl=p;mic.chunks.push(d);mic.len+=d.length;if(mic.len>ctx.sampleRate*12)stopMic();};

 let a=0,b=all.length-1;const th=.02;while(a<b&&Math.abs(all[a])<th)a++;while(b>a&&Math.abs(all[b])<th)b--;a=Math.max(0,a-Math.floor(ctx.sampleRate*.01));b=Math.min(all.length-1,b+Math.floor(ctx.sampleRate*.05));
 if(b-a<ctx.sampleRate*.03){toast('Nada captado. Tente de novo, mais perto do microfone.');refresh();return;}

function region(m){const d=m.buf.getChannelData(0),a=Math.floor(m.start*d.length),b=Math.max(a+16,Math.floor(m.end*d.length));return d.slice(a,b);}

 if(a==='trim'){m.buf=fromData(region(m),sr);m.start=0;m.end=1;}
 else if(a==='rev'){const d=region(m);d.reverse();m.buf=fromData(d,sr);m.start=0;m.end=1;}

function b64(i16){const u=new Uint8Array(i16.buffer);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Int16Array(u.buffer);}

 const blob=new Blob([JSON.stringify(o)],{type:'application/json'});let file=null;try{file=new File([blob],'samplerduo-backup.json',{type:'application/json'});}catch(e){}
